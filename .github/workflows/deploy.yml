name: Deploy A & B to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js 20 (do NOT enable pnpm cache here)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Enable pnpm via Corepack
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      # Cache pnpm store manually
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('b/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      # Install dependencies for project b
      - name: Install dependencies
        working-directory: b
        run: pnpm install

      # Build project b (rsbuild)
      - name: Build b project
        working-directory: b
        run: pnpm build

      # Prepare files for GitHub Pages
      - name: Prepare Pages files
        run: |
          mkdir -p dist
          cp -r a dist/a
          cp -r b/dist dist/b

      # Upload build artifacts for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
