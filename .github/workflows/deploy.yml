name: Deploy A & B to GitHub Pages

on:
  # Trigger deployment on every push to main branch
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 4. Install dependencies for project B (rsbuild React app)
      - name: Install dependencies (B)
        working-directory: b
        run: pnpm install --frozen-lockfile

      # 5. Build project B
      - name: Build B
        working-directory: b
        run: pnpm build

      # 6. Prepare GitHub Pages artifact directory
      - name: Prepare Pages artifact
        run: |
          rm -rf pages
          mkdir -p pages

          # Project A (static files)
          cp -r a pages/a

          # Project B (rsbuild build output)
          cp -r b/dist pages/b

      # 7. Upload Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
